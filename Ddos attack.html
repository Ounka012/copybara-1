<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDoS Attack Simulator | MKRA</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #0f0;
  }

  /* Matrix rain canvas */
  canvas#matrix {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0.6;
  }

  /* DDoS visualization canvas */
  canvas#ddos {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
  }

  /* Spinning globe canvas */
  canvas#globe {
    position: fixed;
    top: 70px;
    right: 30px;
    z-index: 3;
    filter: drop-shadow(0 0 12px #0f0);
  }

  /* Scanline overlay */
  .scanlines {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 255, 0, 0.02) 0px,
      rgba(0, 255, 0, 0.02) 2px,
      transparent 2px,
      transparent 4px
    );
    z-index: 10;
    pointer-events: none;
  }

  /* Top title */
  .hacker-title {
    position: fixed;
    z-index: 3;
    color: #0f0;
    text-shadow: 0 0 20px #0f0, 0 0 40px #0f0;
    font-size: 32px;
    font-weight: bold;
    top: 30px;
    left: 30px;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: glitch 0.15s infinite;
  }

  /* Bottom terminal */
  .terminal-output {
    position: fixed;
    bottom: 30px;
    left: 30px;
    z-index: 3;
    color: #0f0;
    font-size: 16px;
    text-shadow: 0 0 5px #0f0;
    line-height: 1.6;
    max-width: 500px;
  }

  .cursor {
    animation: blink 1s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(2px, -2px); }
    60% { transform: translate(-1px, -1px); }
    80% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
  }

  /* DDoS stats panel */
  .stats {
    position: fixed;
    top: 100px;
    left: 30px;
    z-index: 3;
    border: 1px solid #0f0;
    padding: 15px;
    background: rgba(0,0,0,0.8);
    box-shadow: 0 0 15px #0f0;
  }
  .stats p {
    margin: 5px 0;
    font-size: 14px;
  }
  .stats span {
    color: #f00;
    font-weight: bold;
  }
</style>
</head>
<body>
<div class="hacker-title">⚡ MKRA DDoS ATTACK IN PROGRESS ⚡</div>
<div class="stats">
  <p>Target: <span id="target">192.168.1.1</span></p>
  <p>Packets sent: <span id="packets">0</span></p>
  <p>Bandwidth: <span id="bandwidth">0</span> MB/s</p>
  <p>Nodes active: <span id="nodes">0</span></p>
</div>
<div class="terminal-output">
  > Initializing DDoS module...<br>
  > Spoofing IP addresses...<br>
  > Amplifying DNS reflection...<br>
  > Firing packets... <span class="cursor">█</span>
</div>

<canvas id="matrix"></canvas>
<canvas id="ddos"></canvas>
<canvas id="globe" width="180" height="180"></canvas>
<div class="scanlines"></div>

<script>
// ====== MATRIX RAIN ======
const matrixCanvas = document.getElementById('matrix');
const mctx = matrixCanvas.getContext('2d');
function resizeMatrix() {
  matrixCanvas.width = window.innerWidth;
  matrixCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeMatrix);
resizeMatrix();

const chars = 'ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ0123456789';
const fontSize = 14;
const columns = Math.floor(matrixCanvas.width / fontSize);
const drops = Array(columns).fill(1);

function drawMatrix() {
  mctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
  mctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
  mctx.fillStyle = '#0F0';
  mctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    const x = i * fontSize;
    const y = drops[i] * fontSize;
    mctx.fillText(text, x, y);
    if (y > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}
setInterval(drawMatrix, 33);

// ====== SPINNING GLOBE (small) ======
const globeCanvas = document.getElementById('globe');
const gctx = globeCanvas.getContext('2d');
let gAngle = 0;
function drawGlobe() {
  const R = 70;
  const cx = 90, cy = 90;
  gctx.clearRect(0, 0, 180, 180);
  gctx.strokeStyle = '#0f0';
  gctx.lineWidth = 1;
  gctx.shadowColor = '#0f0';
  gctx.shadowBlur = 6;
  // meridians
  for (let lon = 0; lon < 360; lon += 30) {
    gctx.beginPath();
    for (let lat = -90; lat <= 90; lat += 5) {
      const phi = (lat * Math.PI) / 180;
      const theta = ((lon - gAngle) * Math.PI) / 180;
      const x = cx + R * Math.cos(phi) * Math.cos(theta);
      const y = cy + R * Math.sin(phi);
      if (lat === -90) gctx.moveTo(x, y);
      else gctx.lineTo(x, y);
    }
    gctx.stroke();
  }
  // parallels
  for (let lat = -60; lat <= 60; lat += 30) {
    gctx.beginPath();
    for (let lon = 0; lon <= 360; lon += 5) {
      const phi = (lat * Math.PI) / 180;
      const theta = ((lon - gAngle) * Math.PI) / 180;
      const x = cx + R * Math.cos(phi) * Math.cos(theta);
      const y = cy + R * Math.sin(phi);
      if (lon === 0) gctx.moveTo(x, y);
      else gctx.lineTo(x, y);
    }
    gctx.stroke();
  }
  gctx.shadowBlur = 0;
  gAngle += 0.5;
  requestAnimationFrame(drawGlobe);
}
drawGlobe();

// ====== DDoS ATTACK VISUALIZATION ======
const ddosCanvas = document.getElementById('ddos');
const dctx = ddosCanvas.getContext('2d');
function resizeDdos() {
  ddosCanvas.width = window.innerWidth;
  ddosCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeDdos);
resizeDdos();

// Attack nodes
const attackNodes = [];
const NUM_NODES = 25;
const server = { x: ddosCanvas.width / 2, y: ddosCanvas.height / 2 };

// Init nodes at random positions around the screen edges
for (let i = 0; i < NUM_NODES; i++) {
  let x, y;
  // place on edges
  const edge = Math.floor(Math.random() * 4);
  if (edge === 0) { // top
    x = Math.random() * ddosCanvas.width;
    y = 0;
  } else if (edge === 1) { // right
    x = ddosCanvas.width;
    y = Math.random() * ddosCanvas.height;
  } else if (edge === 2) { // bottom
    x = Math.random() * ddosCanvas.width;
    y = ddosCanvas.height;
  } else { // left
    x = 0;
    y = Math.random() * ddosCanvas.height;
  }
  attackNodes.push({
    x, y,
    size: 4 + Math.random() * 6,
    angle: Math.random() * Math.PI * 2,
    speed: 0.2 + Math.random() * 0.5,
    radius: 20 + Math.random() * 60 // wander radius
  });
}

// Packets (dots moving from node to server)
let packets = [];
let totalPackets = 0;
let bandwidth = 0;

function createPacket(fromNode) {
  return {
    x: fromNode.x,
    y: fromNode.y,
    // target is server but with slight offset for visual effect
    targetX: server.x + (Math.random() - 0.5) * 80,
    targetY: server.y + (Math.random() - 0.5) * 80,
    progress: 0,
    speed: 0.01 + Math.random() * 0.03
  };
}

// Initial burst of packets
for (let i = 0; i < 50; i++) {
  packets.push(createPacket(attackNodes[Math.floor(Math.random() * NUM_NODES)]));
}

// Update nodes movement (orbit around edge areas)
function updateNodes() {
  for (let node of attackNodes) {
    // make them wander around their initial position
    node.angle += 0.02;
    node.x += Math.cos(node.angle) * node.speed * 0.3;
    node.y += Math.sin(node.angle) * node.speed * 0.3;
    // keep within screen bounds loosely
    if (node.x < -20) node.x = ddosCanvas.width + 20;
    if (node.x > ddosCanvas.width + 20) node.x = -20;
    if (node.y < -20) node.y = ddosCanvas.height + 20;
    if (node.y > ddosCanvas.height + 20) node.y = -20;
  }
}

// Update packets
function updatePackets() {
  for (let i = packets.length - 1; i >= 0; i--) {
    let p = packets[i];
    p.progress += p.speed;
    if (p.progress >= 1) {
      // Packet reached server, count it
      totalPackets++;
      bandwidth += (Math.random() * 0.5 + 0.1);
      packets.splice(i, 1);
    }
  }
  // Continuously spawn new packets from random nodes
  if (packets.length < 150) {
    for (let i = 0; i < 5; i++) {
      packets.push(createPacket(attackNodes[Math.floor(Math.random() * NUM_NODES)]));
    }
  }
}

// Update stats display
function updateStats() {
  document.getElementById('packets').textContent = totalPackets;
  document.getElementById('bandwidth').textContent = bandwidth.toFixed(2);
  document.getElementById('nodes').textContent = NUM_NODES;
  // Randomly change target IP
  if (Math.random() < 0.01) {
    document.getElementById('target').textContent = 
      `${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`;
  }
}

// Draw everything
function drawDdos() {
  dctx.clearRect(0, 0, ddosCanvas.width, ddosCanvas.height);

  // Draw attack lines from nodes to server (subtle)
  dctx.strokeStyle = 'rgba(255, 0, 0, 0.07)';
  dctx.lineWidth = 1;
  for (let node of attackNodes) {
    dctx.beginPath();
    dctx.moveTo(node.x, node.y);
    dctx.lineTo(server.x, server.y);
    dctx.stroke();
  }

  // Draw attack nodes (red dots with glow)
  dctx.shadowColor = '#ff0000';
  dctx.shadowBlur = 10;
  for (let node of attackNodes) {
    dctx.fillStyle = '#ff3333';
    dctx.beginPath();
    dctx.arc(node.x, node.y, node.size, 0, Math.PI * 2);
    dctx.fill();
    // inner bright core
    dctx.fillStyle = '#ff8888';
    dctx.beginPath();
    dctx.arc(node.x, node.y, node.size * 0.5, 0, Math.PI * 2);
    dctx.fill();
  }

  // Draw packets (moving dots)
  dctx.shadowColor = '#ffaa00';
  dctx.shadowBlur = 8;
  for (let p of packets) {
    const currentX = p.x + (p.targetX - p.x) * p.progress;
    const currentY = p.y + (p.targetY - p.y) * p.progress;
    // gradient from red to yellow
    const grad = dctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, 4);
    grad.addColorStop(0, '#ffff00');
    grad.addColorStop(1, '#ff0000');
    dctx.fillStyle = grad;
    dctx.beginPath();
    dctx.arc(currentX, currentY, 3, 0, Math.PI * 2);
    dctx.fill();
  }

  // Draw central server (glowing green/cyan)
  dctx.shadowColor = '#0ff';
  dctx.shadowBlur = 25;
  dctx.fillStyle = '#00ffff';
  dctx.strokeStyle = '#0f0';
  dctx.lineWidth = 2;
  // server body
  dctx.fillRect(server.x - 50, server.y - 40, 100, 80);
  dctx.strokeRect(server.x - 50, server.y - 40, 100, 80);
  // server label
  dctx.font = 'bold 16px monospace';
  dctx.fillStyle = '#000';
  dctx.shadowBlur = 0;
  dctx.fillText('SERVER', server.x - 35, server.y + 8);
  dctx.fillStyle = '#0f0';
  dctx.shadowColor = '#0f0';
  dctx.shadowBlur = 8;
  dctx.fillText('SERVER', server.x - 35, server.y + 8);
  // blinking lights on server
  dctx.fillStyle = '#ff0000';
  dctx.shadowColor = '#ff0000';
  dctx.shadowBlur = 5;
  for (let i = 0; i < 5; i++) {
    if (Math.random() > 0.4) {
      dctx.beginPath();
      dctx.arc(server.x - 30 + i * 15, server.y - 25, 3, 0, Math.PI*2);
      dctx.fill();
    }
  }

  // Reset shadow
  dctx.shadowBlur = 0;
}

function animateDdos() {
  updateNodes();
  updatePackets();
  updateStats();
  drawDdos();
  requestAnimationFrame(animateDdos);
}
animateDdos();

// Adjust server position on resize
window.addEventListener('resize', () => {
  server.x = ddosCanvas.width / 2;
  server.y = ddosCanvas.height / 2;
});
</script>
</body>
</html>
